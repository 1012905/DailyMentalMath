name: Deploy to GitHub Pages

# Publishes the static build to https://1012905.github.io/DailyMentalMath/
# (Settings → Pages → Source = "GitHub Actions").

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN scopes: read the repo, publish to Pages, mint the OIDC token
# that actions/deploy-pages exchanges for a deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time. Queued runs are kept (cancel-in-progress:
# false) so a push that lands mid-deploy is not silently dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Guard — no external CDN in the bundle
        run: |
          set -euo pipefail
          # Absolute URLs are fine in metadata (rel=canonical, og:url, JSON-LD);
          # an actual subresource fetch is not. Strip the canonical link first.
          html=$(tr -d '\n' < dist/index.html | sed 's/<link rel="canonical"[^>]*>//g')
          offenders=$(printf '%s' "$html" | grep -oE '(src|href)="https?://[^"]+"' || true)
          if [ -n "$offenders" ]; then
            echo "::error::dist/index.html still loads an external resource:"
            echo "$offenders"
            exit 1
          fi
          if grep -q 'fonts.googleapis.com\|fonts.gstatic.com' dist/index.html; then
            echo "::error::Google Fonts CDN reference survived the build"
            exit 1
          fi
          echo "OK: no external subresources in dist/index.html"

      - name: Guard — PWA assets are present
        run: |
          set -euo pipefail
          for f in dist/manifest.webmanifest dist/sw.js dist/favicon.svg \
                   dist/icon-192.png dist/icon-512.png dist/icon-maskable-512.png \
                   dist/og-image.png dist/fonts/fonts.css; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done
          echo "OK: PWA/SEO assets present"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
